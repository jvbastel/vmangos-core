stamina = 0.5
mana = 0.06
healing = 0.7
mp5 = 1.5
spell_crit = 6.0
armor = 0.01
armor_bonus = 0.01
wand_dps = 1.0

[roles.warlock_ranged]
shapes = [["staff", "twohand"], ["one-hand-and-off-hand", "mainhand", "holdable"]]
[roles.warlock_ranged.weapons]
