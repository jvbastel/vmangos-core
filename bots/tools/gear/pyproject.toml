[project]
name = "wowai-gear"
version = "0.1.0"
description = "The gear template generator of WOWAI and its shared item data module."
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
