[project]
name = "wowai-gear"
version = "0.1.0"
description = "The gear template generator of WOWAI and its shared item data module."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "mpyq>=0.2.5",
    "pillow>=13.0.0",
    "pymysql>=1.1",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
