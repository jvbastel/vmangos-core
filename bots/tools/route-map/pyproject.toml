[project]
name = "wowai-route-map"
version = "0.1.0"
description = "The dungeon map of WOWAI: a local page that draws a dungeon's navmesh floor and its route."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "matplotlib>=3.9",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
