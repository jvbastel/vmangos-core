# The CI of the WOWAI fork. On each pull request into wowai it builds the
# fork with the code tests of the bot decision library (src/bots), runs them
# with ctest, and makes sure that src/bots builds alone, without game headers
# (ADR 0002 of WOWAI). `wowai/dev test` runs the same `wowai/bots-test.sh`
# locally. The fork-rules job runs `wowai/fork-check.sh`: changed core files
# must be on `wowai/core-allowlist.txt`, and the bot code has no DEBUG lines.
#
# The bots job runs in the base image of the dev container and of the
# vmangos-deploy build stage, with the same packages as
# `wowai/dev-container/Dockerfile`. Keep the three in step.
#
# The scripts job runs shellcheck on each shell script under wowai/ (see
# `wowai/shellcheck.sh`) and the script tests that need no Docker.
name: WOWAI CI

# It runs only on pull requests into wowai, not on every push, to save CI
# minutes. The wowai branch rules require its checks, so they still gate merges.
on:
  pull_request:
    branches:
      - wowai

# A newer commit on the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fork-rules:
    name: Check the core file allowlist and DEBUG lines
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository with its full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream development
        run: >-
          git fetch --no-tags https://github.com/vmangos/core.git
          +development:refs/remotes/upstream/development

      - name: Test the fork rules check
        run: wowai/tests/fork-check.test.sh

      - name: Check the fork rules (wowai/core-allowlist.txt, no DEBUG lines)
        run: wowai/fork-check.sh upstream/development

  bots:
    name: Build the fork and run the bot code tests
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: read

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libcurl4-openssl-dev \
            libmysqlclient-dev \
            libssl-dev \
            zlib1g-dev \
            libgtest-dev \
            rsync

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build the fork with the bot code tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$PWD/_install" \
            -DBUILD_EXTRACTORS=0 \
            -DBUILD_BOT_TESTS=1 \
            -DBUILD_FOR_HOST_CPU=0 \
            -DENABLE_MAILSENDER=1 \
            -DENABLE_CPPTRACE=0 \
            -DSUPPORTED_CLIENT_BUILD=5875
          cmake --build build --parallel "$(nproc)"

      - name: Run the bot code tests
        shell: bash
        run: ctest --test-dir build --output-on-failure

      # The pure math of the Forever Warrior mechanics (#214), with the host compiler.
      - name: Run the Forever Warrior rules test
        shell: bash
        run: wowai/tests/forever-warrior-rules.test.sh

      # The pure rules of Victory Rush under the Forever rules (#213), with the host compiler.
      - name: Run the Forever Victory Rush rules test
        shell: bash
        run: wowai/tests/forever-victory-rush.test.sh

      # The pure rules of the Forever Protection talents (#219), with the host compiler.
      - name: Run the Forever Protection rules test
        shell: bash
        run: wowai/tests/forever-protection-rules.test.sh

      - name: Build src/bots alone (no game headers) and run its tests
        shell: bash
        run: wowai/bots-test.sh "$PWD/src/bots" "$RUNNER_TEMP/bots"

  scripts:
    name: Check the wowai scripts and run their tests
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: read

    steps:
      - name: Install the script tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y --no-install-recommends \
            ca-certificates \
            git \
            python3 \
            shellcheck

      - name: Check out repository
        uses: actions/checkout@v6

      # The checkout belongs to another user than the job container.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run shellcheck on the wowai scripts
        shell: bash
        run: wowai/shellcheck.sh

      # The tests that need no Docker, or that use the fake-docker helper.
      # Skipped, because they need a real Docker daemon and the dev container
      # (run them by hand):
      #   wowai/tests/bots-test.test.sh   (the bots job runs the same tests)
      #   wowai/tests/dev-build.test.sh   (a full dev build)
      #   wowai/tests/dev-lock.test.sh    (the lock of a dev container)
      #   wowai/tests/test-realm.test.sh  (a full test realm)
      #   wowai/tests/check-kit.test.sh   (two pool slots; --quick runs here)
      #   wowai/tests/game-layer-map.test.sh --realm <N>  (columns, GM commands; the paths run here)
      - name: Run the script tests that need no Docker
        shell: bash
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          wowai/release/tests/merge-upstream.test.sh
          wowai/release/tests/release-core.test.sh
          wowai/tests/check-kit.test.sh --quick
          wowai/tests/realm-pool.test.sh
          wowai/tests/forever-client.test.sh
          wowai/tests/game-layer-map.test.sh
          python3 wowai/tests/test_wowclient.py
          python3 wowai/tests/test_runs.py
          python3 wowai/tests/test_watch.py
