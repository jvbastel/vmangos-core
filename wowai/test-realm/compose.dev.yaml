# The dev override of the test realm: mangosd and realmd run the binaries of
# the dev install folder (`wowai/dev build`) instead of the image's. mangosd
# also reads the bot data files of the fork (WOWAI_BOT_DATA, `bots/data`) from
# its working folder, where the default `Bots.DataDir = "bots"` finds them.

services:
  realmd:
    volumes:
      - ${WOWAI_DEV_INSTALL:?}/bin:/opt/vmangos/bin:ro

  mangosd:
    volumes:
      - ${WOWAI_DEV_INSTALL:?}/bin:/opt/vmangos/bin:ro
      - ${WOWAI_BOT_DATA:?}:/home/vmangos/bots:ro
